name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOnAzeroth
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: LifeOnAzeroth
          path: dist
      - name: Keep the published companion when its code is unchanged
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ] && git diff --quiet "$prev" "$GITHUB_REF_NAME" -- companion; then
            if curl -fsSL -o "$RUNNER_TEMP/app.exe" "https://github.com/$GITHUB_REPOSITORY/releases/download/$prev/LifeOnAzerothCompanion.exe"; then
              mv "$RUNNER_TEMP/app.exe" dist/LifeOnAzerothCompanion.exe
              echo "Reusing the companion from $prev"
            fi
          fi
          sha256sum dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  curseforge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - id: toc
        run: echo "version=$(grep -m1 '^## Version:' LifeOnAzeroth_Market/LifeOnAzeroth_Market.toc | awk '{print $3}' | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - name: Prepare the addon folder for packaging
        if: format('v{0}', steps.toc.outputs.version) == github.ref_name
        run: |
          PKG="$RUNNER_TEMP/pkg"
          mkdir -p "$PKG"
          cp -r LifeOnAzeroth_Market/. "$PKG/"
          {
            echo "# Life on Azeroth: Market ${GITHUB_REF_NAME#v}"
            echo
            echo "The companion app that keeps prices up to date is on GitHub: https://github.com/sanredz/LifeOnAzeroth-Addon/releases/tag/$GITHUB_REF_NAME"
          } > "$PKG/CHANGELOG.md"
          cd "$PKG"
          git init -q
          git config user.name "Sanjin Redzepagic"
          git config user.email "sr@sanred.se"
          git add -A
          git commit -q -m "$GITHUB_REF_NAME"
          git tag "$GITHUB_REF_NAME"
      - uses: BigWigsMods/packager@v2
        if: format('v{0}', steps.toc.outputs.version) == github.ref_name
        with:
          args: -t ${{ runner.temp }}/pkg
